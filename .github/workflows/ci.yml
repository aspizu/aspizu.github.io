name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2
        with:
          version: 11.5.2
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check Worker types
        run: pnpm exec wrangler types --check

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2
        with:
          version: 11.5.2
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm build

      - name: Upload build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v2
        with:
          version: 11.5.2
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
